name: Validar dados do emprego formal

on:
  push:
    paths:
      - "data/emprego-formal.json"
      - "scripts/process_novo_caged.py"
      - ".github/workflows/validate-employment-data.yml"
  pull_request:
    paths:
      - "data/emprego-formal.json"
      - ".github/workflows/validate-employment-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar sintaxe do processador
        run: python -m py_compile scripts/process_novo_caged.py
      - name: Validar estrutura e consistência
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("data/emprego-formal.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          required = {"source", "municipality", "ibge_code", "unit", "reference", "data"}
          missing = required - payload.keys()
          assert not missing, f"Campos ausentes: {sorted(missing)}"
          assert payload["municipality"] == "Contagem"
          assert payload["ibge_code"] == "3118601"
          assert isinstance(payload["data"], list)

          periods = []
          for index, row in enumerate(payload["data"]):
              assert re.fullmatch(r"\d{4}-(0[1-9]|1[0-2])", row["period"]), f"Período inválido na linha {index + 1}"
              periods.append(row["period"])
              for key in ("admissions", "dismissals", "balance"):
                  assert isinstance(row.get(key), int), f"{key} deve ser inteiro na linha {index + 1}"
              assert row["balance"] == row["admissions"] - row["dismissals"], f"Saldo inconsistente em {row['period']}"
              stock = row.get("stock")
              assert stock is None or isinstance(stock, int), f"Estoque inválido em {row['period']}"

          assert periods == sorted(set(periods)), "Períodos devem estar ordenados e não podem se repetir"

          for index, row in enumerate(payload["data"]):
              variation = row.get("relative_variation")
              assert variation is None or isinstance(variation, (int, float)), f"Variação relativa inválida em {row['period']}"

          annual = payload.get("annual_summary", [])
          if annual:
              years = [row.get("year") for row in annual]
              assert years == sorted(set(years)), "Anos da série anual devem estar ordenados e sem duplicatas"
              for row in annual:
                  assert isinstance(row.get("year"), int), "Ano da série anual deve ser inteiro"
                  for key in ("admissions", "dismissals", "balance", "stock"):
                      assert isinstance(row.get(key), int), f"{key} inválido no ano {row.get('year')}"
                  assert row["balance"] == row["admissions"] - row["dismissals"], f"Saldo anual inconsistente em {row['year']}"
                  variation = row.get("relative_variation")
                  assert variation is None or isinstance(variation, (int, float)), f"Variação anual inválida em {row['year']}"

          sectors = payload.get("sectors", [])
          if sectors:
              assert periods, "Não é possível validar setores sem uma competência mensal"
              latest = payload["data"][-1]
              for row in sectors:
                  assert isinstance(row.get("sector"), str) and row["sector"].strip(), "Setor sem identificação"
                  for key in ("admissions", "dismissals", "balance"):
                      assert isinstance(row.get(key), int), f"{key} inválido no setor {row.get('sector')}"
                  assert row["balance"] == row["admissions"] - row["dismissals"], f"Saldo inconsistente no setor {row['sector']}"
              for key in ("admissions", "dismissals", "balance"):
                  assert sum(row[key] for row in sectors) == latest[key], f"Soma setorial não confere com o total municipal: {key}"

          print(
              f"JSON estruturalmente válido: {len(periods)} competência(s), "
              f"{len(annual)} ano(s) e {len(sectors)} setor(es)."
          )
          PY
